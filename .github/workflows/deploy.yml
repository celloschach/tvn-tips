name: 2. Build and Deploy Website

on:
  # Dieser Workflow startet IMMER, wenn etwas auf den 'main' Branch gepusht wird
  # (Also auch, wenn Workflow 1 gerade seine JSON-Dateien gepusht hat!)
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # ⚠️ DER VITE-TRICK:
      # Vite ignoriert Ordner außerhalb von 'src' oder 'public'.
      # Wir kopieren die synchronisierten Tabellen in den 'public' Ordner,
      # damit Vite sie beim Bauen mit in die finale Website nimmt.
      - name: Prepare tables for Vite build
        run: |
          mkdir -p public/generated
          cp -r generated/* public/generated/

      - name: Build Vite Project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
