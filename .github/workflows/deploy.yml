name: 2. Build and Deploy Website

on:
  # Dieser Workflow startet IMMER, wenn etwas auf den 'main' Branch gepusht wird
  # (Also auch, wenn Workflow 1 gerade seine JSON-Dateien gepusht hat!)
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # WICHTIG: 'npm ci' statt 'npm install', damit exakt die Versionen aus
        # package-lock.json installiert werden (reproduzierbarer Build).
        run: npm ci

      # Die Tabellen JSONs liegen bereits versioniert in 'public/generated'
      # und werden von Vite automatisch mitgebaut. Ein separates Kopieren aus
      # einem Root-Ordner 'generated/' ist nicht nötig (und war Fehlerquelle,
      # weil dieser Ordner im Repo nie existiert hat -> "cp: generated/* No
      # such file or directory").

      - name: Check Supabase secrets are configured
        # Fail-fast mit klarer Fehlermeldung, statt die Seite mit leerer
        # Supabase-URL zu deployen (die dann live abstuerzt).
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Secrets 'VITE_SUPABASE_URL' und/oder 'VITE_SUPABASE_ANON_KEY' fehlen! Bitte unter Settings -> Secrets and variables -> Actions anlegen."
            exit 1
          fi
          echo "✅ Supabase-Secrets gefunden."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Vite Project
        run: npm run build
        env:
          # Supabase-Client liest diese Werte zur Buildzeit via import.meta.env.
          # Fehlen sie, stürzt die Seite live mit "FEHLER: Supabase URL oder
          # Key ist nicht definiert!" ab.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
