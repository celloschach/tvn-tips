name: 1. Sync Data (Games & Tables)

on:
  schedule:
    - cron: '0 3 * * *'  # Jeden Tag um 03:00 Uhr
  workflow_dispatch:     # Manuelles Auslösen erlaubt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Sync Script
        run: node sync.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # WICHTIG: Wir committen die neuen JSON-Dateien auf den main Branch.
      # Das löst automatisch Workflow 2 (Deploy) aus!
      - name: Commit and Push generated files
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add generated/
          git commit -m "chore: auto-update games and tables" || echo "Keine Änderungen"
          git push
