name: 1. Sync Data (Games & Tables)

on:
  schedule:
    - cron: '0 3 * * *'  # Jeden Tag um 03:00 Uhr
  workflow_dispatch:     # Manuelles Auslösen erlaubt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:

          node-version: '20'

      - name: Install dependencies
        # 'npm ci' installiert reproduzierbar exakt die Versionen aus package-lock.json.
        run: npm ci

      - name: Run Sync Script (Spiele aus ICS)
        run: node sync.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch Tables (Tabellen von basketbal-bund.net)
        # fetchAllTables.cjs schreibt direkt nach public/generated/.
        # Ohne diesen Schritt bleiben die Tabellen-JSONs veraltet.
        run: node fetchAllTables.cjs

      # WICHTIG: Wir committen die neuen Dateien auf den main Branch.
      # Das löst automatisch Workflow 2 (Deploy) aus!
      # commit -am erfasst auch geänderte Dateien in public/generated/.
      - name: Commit and Push generated files
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add public/generated/
          git commit -m "chore: auto-update games and tables" || echo "Keine Änderungen"
          git push
