<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Mail bestätigt - TVN Tipp-Spiel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      color: #FFB800;
      margin-bottom: 16px;
    }
    p {
      color: #a0a0a0;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      background: linear-gradient(135deg, #FFB800 0%, #FFA500 100%);
      color: #1a1a2e;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s;
    }
    .button:hover {
      transform: translateY(-2px);
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #FFB800;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏀</div>
    <h1>E-Mail wird bestätigt...</h1>
    <div class="spinner"></div>
    <p id="message">Bitte warten, du wirst gleich weitergeleitet.</p>
  </div>

  <script>
    // Warte kurz, damit Supabase den Token verarbeiten kann
    setTimeout(() => {
      // Prüfe ob Bestätigung erfolgreich war
      const hash = window.location.hash;
      if (hash.includes('access_token') || hash.includes('type=signup')) {
        document.getElementById('message').innerHTML = 
          '✅ <strong>Erfolgreich bestätigt!</strong><br>Du wirst zur App weitergeleitet...';
        
        // Leite zur Hauptseite weiter
        setTimeout(() => {
          window.location.href = '/tvn-tips/';
        }, 2000);
      } else {
        document.getElementById('message').innerHTML = 
          '❌ <strong>Fehler bei der Bestätigung.</strong><br>Bitte versuche es erneut oder kontaktiere den Support.';
      }
    }, 1000);
  </script>
</body>
</html>
